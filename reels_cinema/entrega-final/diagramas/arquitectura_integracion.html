<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Arquitectura de integración · Reels Cinema</title>
<style>body{margin:0;background:#fff} text{font-family:"Segoe UI",Arial,sans-serif}</style></head>
<body><div id="lienzo" style="width:1400px">
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
<defs>
  <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker>
  <marker id="fpg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#336791"/></marker>
  <marker id="fmg" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#13874a"/></marker>
</defs>
<text x="40" y="48" font-size="28" font-weight="700" fill="#1d1d1f">Reels Cinema · <tspan fill="#c98f00">Arquitectura de integración</tspan></text>
<text x="40" y="76" font-size="15" fill="#5b6170">Tres formas de usar el sistema llegan a la misma capa de Python, que habla con los dos motores por separado y cruza los resultados con los identificadores compartidos.</text>

<!-- Clientes -->
<text x="40" y="122" font-size="13" font-weight="700" fill="#5b6170" letter-spacing="1.5">CLIENTES</text>
<g>
  <rect x="40" y="134" width="400" height="92" rx="12" fill="#f3f4f6" stroke="#cfd3da" stroke-width="2"/>
  <text x="60" y="166" font-size="19" font-weight="700" fill="#1d1d1f">Postman</text>
  <text x="60" y="190" font-size="14" fill="#444">Colección con 20 peticiones (casos, transacción</text>
  <text x="60" y="210" font-size="14" fill="#444">y errores 400 · 404 · 409 · 503)</text>
  <rect x="500" y="134" width="400" height="92" rx="12" fill="#f3f4f6" stroke="#cfd3da" stroke-width="2"/>
  <text x="520" y="166" font-size="19" font-weight="700" fill="#1d1d1f">Página web (Streamlit)</text>
  <text x="520" y="190" font-size="14" fill="#444">front/app.py · cartelera, sillas, comida y pago,</text>
  <text x="520" y="210" font-size="14" fill="#444">reseñas y reportes · usa su propia conexión</text>
  <rect x="960" y="134" width="400" height="92" rx="12" fill="#f3f4f6" stroke="#cfd3da" stroke-width="2"/>
  <text x="980" y="166" font-size="19" font-weight="700" fill="#1d1d1f">Menú interactivo</text>
  <text x="980" y="190" font-size="14" fill="#444">script_integracion.py · pide los ids y</text>
  <text x="980" y="210" font-size="14" fill="#444">muestra el resultado de cada caso</text>
</g>

<!-- Capa Python -->
<rect x="40" y="290" width="1320" height="300" rx="16" fill="#fff6df" stroke="#c98f00" stroke-width="3"/>
<text x="1336" y="324" font-size="13" font-weight="700" fill="#8a6200" letter-spacing="1.5" text-anchor="end">CAPA DE INTEGRACIÓN · PYTHON</text>
<rect x="64" y="342" width="360" height="222" rx="10" fill="#fff" stroke="#e2c46d" stroke-width="1.5"/>
<text x="84" y="374" font-size="18" font-weight="700" fill="#1d1d1f" font-family="Consolas,monospace">api.py</text>
<text x="84" y="398" font-size="14" fill="#444">API REST con Flask</text>
<text x="84" y="426" font-size="14" fill="#444">· 7 endpoints (GET y POST)</text>
<text x="84" y="450" font-size="14" fill="#444">· valida el JSON de entrada</text>
<text x="84" y="474" font-size="14" fill="#444">· cada error se devuelve en JSON</text>
<text x="84" y="498" font-size="14" fill="#444">  con su código HTTP</text>
<text x="84" y="530" font-size="13" fill="#8a6200">http://127.0.0.1:5000/api/…</text>

<rect x="470" y="342" width="460" height="222" rx="10" fill="#fff" stroke="#e2c46d" stroke-width="1.5"/>
<text x="490" y="374" font-size="18" font-weight="700" fill="#1d1d1f" font-family="Consolas,monospace">casos_uso.py</text>
<text x="490" y="398" font-size="14" fill="#444">Lógica de integración (la usan la API y el menú)</text>
<text x="490" y="428" font-size="14" fill="#1d1d1f"><tspan font-weight="700">Caso 1</tspan> función → requisitos y reseñas</text>
<text x="490" y="452" font-size="14" fill="#1d1d1f"><tspan font-weight="700">Caso 2</tspan> película → ficha y requisitos ($in)</text>
<text x="490" y="476" font-size="14" fill="#1d1d1f"><tspan font-weight="700">Caso 3</tspan> ventas por sala × incidentes por sala</text>
<text x="490" y="500" font-size="14" fill="#1d1d1f"><tspan font-weight="700">Transacción</tspan> cancelar función por falla (saga)</text>
<text x="490" y="524" font-size="14" fill="#1d1d1f"><tspan font-weight="700">Reseñas</tspan> valida ids en PostgreSQL antes de</text>
<text x="490" y="544" font-size="14" fill="#1d1d1f">guardar en MongoDB</text>

<rect x="976" y="342" width="360" height="222" rx="10" fill="#fff" stroke="#e2c46d" stroke-width="1.5"/>
<text x="996" y="374" font-size="18" font-weight="700" fill="#1d1d1f" font-family="Consolas,monospace">conexiones.py</text>
<text x="996" y="398" font-size="14" fill="#444">Lee PG_URI y MONGO_URI del</text>
<text x="996" y="418" font-size="14" fill="#444">archivo .env (no van en el código)</text>
<text x="996" y="450" font-size="14" fill="#336791" font-weight="700">psycopg2 → PostgreSQL</text>
<text x="996" y="472" font-size="13" fill="#444">una conexión por operación</text>
<text x="996" y="502" font-size="14" fill="#13874a" font-weight="700">pymongo → MongoDB</text>
<text x="996" y="524" font-size="13" fill="#444">un cliente reutilizado,</text>
<text x="996" y="544" font-size="13" fill="#444">tiempo de espera de 6 s</text>

<!-- flechas clientes -> python -->
<path d="M240,226 L240,338" stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#f)"/>
<text x="252" y="268" font-size="13" fill="#4a5568">HTTP + JSON</text>
<path d="M1160,226 L1160,262 L700,262 L700,338" stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#f)"/>
<text x="900" y="254" font-size="13" fill="#4a5568">llama las funciones directamente</text>
<path d="M424,452 L466,452" stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#f)"/>
<path d="M930,452 L972,452" stroke="#4a5568" stroke-width="2.2" fill="none" marker-end="url(#f)"/>


<!-- Motores -->
<rect x="40" y="660" width="620" height="270" rx="16" fill="#336791"/>
<text x="64" y="692" font-size="13" font-weight="700" fill="#d6e4f2" letter-spacing="1.5">NÚCLEO TRANSACCIONAL · ACID</text>
<text x="64" y="724" font-size="24" font-weight="700" fill="#fff">PostgreSQL · Neon</text>
<rect x="64" y="742" width="572" height="166" rx="10" fill="#fff"/>
<text x="84" y="770" font-size="14" fill="#1d1d1f">16 tablas: pelicula, funcion, sala, venta, silla_venta,</text>
<text x="84" y="792" font-size="14" fill="#1d1d1f">producto, venta_producto, espectador, staff, obra…</text>
<text x="84" y="822" font-size="14" fill="#1d1d1f">15 triggers · 8 procedimientos · UNIQUE por silla</text>
<text x="84" y="852" font-size="14" fill="#336791" font-weight="700">sp_cancelar_funcion</text><text x="246" y="852" font-size="14" fill="#1d1d1f">cancela función y ventas</text>
<text x="84" y="876" font-size="14" fill="#336791" font-weight="700">sp_registrar_compra</text><text x="246" y="876" font-size="14" fill="#1d1d1f">sillas y comida en 1 transacción</text>
<text x="84" y="898" font-size="13" fill="#5b6170">Responde: SELECT, GROUP BY, CALL, COMMIT / ROLLBACK</text>

<rect x="740" y="660" width="620" height="270" rx="16" fill="#13874a"/>
<text x="764" y="692" font-size="13" font-weight="700" fill="#cdeedb" letter-spacing="1.5">CAPA DOCUMENTAL · BASE</text>
<text x="764" y="724" font-size="24" font-weight="700" fill="#fff">MongoDB · Atlas (base cinema)</text>
<rect x="764" y="742" width="572" height="166" rx="10" fill="#fff"/>
<text x="784" y="770" font-size="14" fill="#1d1d1f" font-family="Consolas,monospace">fichas_tecnicas_peliculas</text>
<text x="784" y="794" font-size="14" fill="#1d1d1f" font-family="Consolas,monospace">requisitos_proyeccion</text>
<text x="784" y="818" font-size="14" fill="#1d1d1f" font-family="Consolas,monospace">resenas_peliculas</text>
<text x="784" y="842" font-size="14" fill="#1d1d1f" font-family="Consolas,monospace">reportes_incidentes</text>
<text x="784" y="872" font-size="14" fill="#1d1d1f">$jsonSchema strict en las 4 colecciones</text>
<text x="784" y="898" font-size="13" fill="#5b6170">Responde: find, aggregate ($group, $in), insert_one, delete_one</text>

<path d="M1080,564 L1080,610 L350,610 L350,656" stroke="#336791" stroke-width="2.6" fill="none" marker-end="url(#fpg)"/>
<path d="M1200,564 L1200,630 L1050,630 L1050,656" stroke="#13874a" stroke-width="2.6" fill="none" marker-end="url(#fmg)"/>
<text x="620" y="602" font-size="13" fill="#336791" font-weight="700">SQL y CALL</text>
<text x="1060" y="650" font-size="13" fill="#13874a" font-weight="700">consultas y documentos</text>

<text x="40" y="964" font-size="13" fill="#5b6170">Identificadores compartidos: id_funcion · id_pelicula · id_sala · id_espectador · id_staff · id_artista · id_obra  —  no hay llaves foráneas entre motores: el cruce lo hace Python</text>
</svg></div></body></html>
