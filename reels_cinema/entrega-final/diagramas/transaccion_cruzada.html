<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Transacción cruzada · Reels Cinema</title>
<style>body{margin:0;background:#fff} text{font-family:"Segoe UI",Arial,sans-serif}</style></head>
<body><div id="lienzo" style="width:1400px">
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1010" viewBox="0 0 1400 1010">
<defs>
  <marker id="f" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
  <marker id="fr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
</defs>
<text x="40" y="48" font-size="28" font-weight="700" fill="#1d1d1f">Transacción cruzada · <tspan fill="#c98f00">cancelar una función por falla técnica</tspan></text>
<text x="40" y="76" font-size="15" fill="#5b6170">Un mismo evento escribe en los dos motores. No comparten una transacción: Python los coordina y, si una escritura falla, deshace la otra (saga con compensación).</text>

<!-- participantes -->
<g font-size="17" font-weight="700" text-anchor="middle">
  <rect x="60" y="100" width="220" height="54" rx="10" fill="#f3f4f6" stroke="#cfd3da" stroke-width="2"/><text x="170" y="133" fill="#1d1d1f">Cliente (Postman)</text>
  <rect x="400" y="100" width="260" height="54" rx="10" fill="#fff6df" stroke="#c98f00" stroke-width="2"/><text x="530" y="133" fill="#8a6200">casos_uso.py</text>
  <rect x="780" y="100" width="240" height="54" rx="10" fill="#336791"/><text x="900" y="133" fill="#fff">PostgreSQL</text>
  <rect x="1120" y="100" width="240" height="54" rx="10" fill="#13874a"/><text x="1240" y="133" fill="#fff">MongoDB</text>
</g>
<g stroke="#b8bdc7" stroke-width="2" stroke-dasharray="6 5">
  <line x1="170" y1="154" x2="170" y2="935"/><line x1="530" y1="154" x2="530" y2="935"/>
  <line x1="900" y1="154" x2="900" y2="935"/><line x1="1240" y1="154" x2="1240" y2="935"/>
</g>

<g font-size="14" fill="#1d1d1f">
  <!-- 1 -->
  <line x1="170" y1="196" x2="524" y2="196" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="182" y="186">POST /api/funciones/46/cancelar-por-incidente</text>
  <!-- validaciones -->
  <line x1="530" y1="236" x2="894" y2="236" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="542" y="226">SELECT empleado y sala de la función</text>
  <!-- paso 1 -->
  <rect x="560" y="262" width="320" height="26" rx="6" fill="#e8f0f8"/>
  <text x="572" y="280" font-weight="700" fill="#336791">Paso 1 · sin COMMIT</text>
  <line x1="530" y1="314" x2="894" y2="314" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="542" y="306">CALL sp_cancelar_funcion(46)</text>
  <rect x="890" y="320" width="20" height="440" fill="#d6e4f2" stroke="#336791"/>
  <text x="920" y="346" font-size="13" fill="#336791">función 'cancelada' y ventas canceladas</text>
  <text x="920" y="364" font-size="13" fill="#336791">(trigger 8), fila bloqueada, aún no visible</text>
  <line x1="890" y1="388" x2="536" y2="388" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="560" y="380">boletas afectadas, valor a reembolsar</text>
  <!-- paso 2 -->
  <rect x="560" y="414" width="320" height="26" rx="6" fill="#e6f5ec"/>
  <text x="572" y="432" font-weight="700" fill="#13874a">Paso 2 · guardar el reporte</text>
  <line x1="530" y1="466" x2="1234" y2="466" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="930" y="458">insert_one en reportes_incidentes</text>
  <line x1="1234" y1="506" x2="536" y2="506" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="930" y="498">_id del reporte</text>

  <!-- alternativa A -->
  <rect x="380" y="524" width="990" height="96" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="380" y="524" width="210" height="24" rx="4" fill="#c0392b"/><text x="392" y="541" font-size="13" font-weight="700" fill="#fff">SI MONGODB RECHAZA</text>
  <text x="604" y="542" font-size="13" fill="#c0392b">(no cumple $jsonSchema o no responde)</text>
  <line x1="530" y1="586" x2="884" y2="586" stroke="#c0392b" stroke-width="2" marker-end="url(#fr)"/>
  <text x="542" y="578" fill="#c0392b" font-weight="700">ROLLBACK</text>
  <text x="920" y="590" font-size="13" fill="#c0392b">la función sigue programada y</text>
  <text x="920" y="608" font-size="13" fill="#c0392b">las ventas quedan intactas</text>

  <!-- paso 3 -->
  <rect x="560" y="640" width="320" height="26" rx="6" fill="#e8f0f8"/>
  <text x="572" y="658" font-weight="700" fill="#336791">Paso 3 · confirmar</text>
  <line x1="530" y1="694" x2="884" y2="694" stroke="#333" stroke-width="2" marker-end="url(#f)"/>
  <text x="542" y="686">COMMIT</text>
  <text x="920" y="700" font-size="13" fill="#336791">la cancelación queda visible</text>

  <!-- alternativa B -->
  <rect x="380" y="724" width="990" height="96" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>
  <rect x="380" y="724" width="250" height="24" rx="4" fill="#c0392b"/><text x="392" y="741" font-size="13" font-weight="700" fill="#fff">SI POSTGRESQL NO CONFIRMA</text>
  <line x1="530" y1="786" x2="884" y2="786" stroke="#c0392b" stroke-width="2" marker-end="url(#fr)"/>
  <text x="542" y="778" fill="#c0392b" font-weight="700">ROLLBACK</text>
  <line x1="530" y1="806" x2="1234" y2="806" stroke="#c0392b" stroke-width="2" marker-end="url(#fr)"/>
  <text x="920" y="800" fill="#c0392b" font-weight="700">delete_one(reporte) · compensación</text>

  <!-- respuesta -->
  <line x1="524" y1="870" x2="176" y2="870" stroke="#333" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f)"/>
  <text x="196" y="860">201 · pasos 1, 2 y 3 cumplidos</text>
  <line x1="524" y1="920" x2="176" y2="920" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#fr)"/>
  <text x="196" y="910" fill="#c0392b">409 TransaccionDeshecha · con la lista de pasos</text>
  <text x="40" y="962" font-size="14" fill="#5b6170">En los dos caminos de error ningún motor queda con la mitad del evento.</text><text x="40" y="984" font-size="14" fill="#5b6170">La API permite forzar cada caso con "simular_fallo": "mongo" o "postgres".</text>
</g>
</svg></div></body></html>
